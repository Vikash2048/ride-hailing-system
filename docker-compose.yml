services:
  
  postgres:
    image: postgres:16-alpine
    container_name: ride_hailing_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_123
      POSTGRES_DB: ride_hailing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ride_hailing_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: